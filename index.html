<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e211b" media="(prefers-color-scheme: dark)">
<meta name="description" content="바나나를 눌러 수확하고 진화시키는 방치형 키우기 게임">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="바나나쑥쑥">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>바나나 쑥쑥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 기본 설정 (아티팩트 때는 자동이던 부분) */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
html { background: var(--bg); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* 레이아웃: 한 화면짜리 모바일 게임. 위에서부터 재화 → 바나나 무대 → 업그레이드 목록 */
:root {
  --bg: #d6efe6;
  --panel: #f6fbf7;
  --panel-2: #e4f3ea;
  --ink: #1c3a2f;
  --muted: #57766a;
  --line: #c4e0d2;
  --banana: #ffd23f;
  --banana-deep: #f0a500;
  --brown: #6a3d1b;
  --leaf: #3f9e4d;
  --sky-a: #bfe8ef;
  --sky-b: #e9f8e6;
  --hill-a: #7fcf7e;
  --hill-b: #5db566;
  --sun: #fff1a8;
  --bad: #e0502b;
  --shadow: rgba(28, 58, 47, .16);
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e211b; --panel: #163229; --panel-2: #1e4034; --ink: #e9f6ee; --muted: #94b6a6;
    --line: #29503f; --sky-a: #123c46; --sky-b: #1b4a3c; --hill-a: #2f7a4d; --hill-b: #246640;
    --sun: #e9efc2; --shadow: rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e211b; --panel: #163229; --panel-2: #1e4034; --ink: #e9f6ee; --muted: #94b6a6;
  --line: #29503f; --sky-a: #123c46; --sky-b: #1b4a3c; --hill-a: #2f7a4d; --hill-b: #246640;
  --sun: #e9efc2; --shadow: rgba(0, 0, 0, .4); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--banana-deep); outline-offset: 2px; }

#app { height: 100%; max-width: 520px; margin-inline: auto; padding-inline: 16px; padding-block: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

/* 재화 */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.wallet { min-width: 0; }
.count { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: clamp(28px, 9vw, 40px); line-height: 1; font-variant-numeric: tabular-nums; }
.count svg { flex: none; width: 34px; height: 34px; }
.count span { overflow-wrap: anywhere; }
.rate { margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate b { color: var(--ink); font-weight: 400; font-family: var(--font-display); }
.stage-chip { flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; font-family: var(--font-display); font-size: 15px; white-space: nowrap; }

/* 무대 */
.stage { position: relative; flex: none; border-radius: 22px; overflow: hidden; background: linear-gradient(180deg, var(--sky-a), var(--sky-b)); border: 2px solid var(--line); height: clamp(280px, 42vh, 380px); display: flex; flex-direction: column; align-items: center; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.scene { position: absolute; inset: 0; pointer-events: none; }
.scene svg { width: 100%; height: 100%; display: block; }
.evo { position: relative; z-index: 2; width: 100%; padding: 10px 14px 0; display: flex; flex-direction: column; gap: 4px; }
.evo-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink); }
.evo-label span:last-child { color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.55); border: 1.5px solid var(--line); overflow: hidden; }
:root[data-theme="dark"] .bar { background: rgba(0,0,0,.25); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar { background: rgba(0,0,0,.25); } }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--banana), var(--banana-deep)); border-radius: 999px; transition: width .25s ease; }

.char-btn { position: relative; z-index: 2; flex: 1; min-height: 0; width: 100%; background: none; border: 0; padding: 0 5% 6px 0; cursor: pointer; display: flex; align-items: flex-end; justify-content: flex-end; }
.char-wrap { position: relative; width: min(50%, 220px); padding-top: 13%; transform: scale(var(--sc, 1)); transform-origin: 50% 100%; transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
.char-bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.char-bob.sleeping { animation-duration: 4.2s; }
.char-squash { transform-origin: 50% 100%; position: relative; }
.lunger { position: relative; }
.gearsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.gearsvg.under { z-index: 0; }
.gearsvg.over { z-index: 2; }
.faces { position: relative; z-index: 1; aspect-ratio: 360 / 335; width: 100%; }
.has-hat .crown { display: none !important; }
.faces img { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; -webkit-user-drag: none; }
.faces img.on { display: block; }
.stage-2 .faces { filter: hue-rotate(-7deg) saturate(1.25) brightness(1.06) drop-shadow(0 0 12px rgba(255, 196, 40, .8)); }
.stage-3 .faces { filter: hue-rotate(-9deg) saturate(1.35) brightness(1.08) drop-shadow(0 0 18px rgba(255, 180, 20, .95)); }
.crown { z-index: 3; position: absolute; left: 57.5%; top: 13%; width: 28%; transform: translate(-50%, -84%) rotate(7deg); display: none; pointer-events: none; filter: drop-shadow(0 2px 0 rgba(106,61,27,.35)); }
.stage-4 .faces { filter: hue-rotate(-12deg) saturate(1.45) brightness(1.1) drop-shadow(0 0 22px rgba(255, 150, 20, 1)); }
.stage-5 .faces { filter: hue-rotate(25deg) saturate(1.5) brightness(1.1) drop-shadow(0 0 24px rgba(120, 150, 255, 1)); }
.stage-6 .faces { animation: rainbow 4s linear infinite; }
@keyframes rainbow { 0% { filter: hue-rotate(0deg) saturate(1.6) brightness(1.12) drop-shadow(0 0 26px rgba(255, 220, 90, 1)); } 100% { filter: hue-rotate(360deg) saturate(1.6) brightness(1.12) drop-shadow(0 0 26px rgba(255, 220, 90, 1)); } }
.stage-3 .crown, .stage-4 .crown, .stage-5 .crown, .stage-6 .crown { display: block; }
.sparkles { z-index: 3; position: absolute; inset: 0; pointer-events: none; display: none; }
.stage-2 .sparkles, .stage-3 .sparkles, .stage-4 .sparkles, .stage-5 .sparkles, .stage-6 .sparkles { display: block; }
.sparkles i { position: absolute; width: 10px; height: 10px; background: #fff7c2; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: twinkle 2.2s ease-in-out infinite; }
.sparkles i:nth-child(1) { left: 6%; top: 40%; animation-delay: 0s; }
.sparkles i:nth-child(2) { left: 88%; top: 30%; animation-delay: .7s; width: 14px; height: 14px; }
.sparkles i:nth-child(3) { left: 78%; top: 72%; animation-delay: 1.3s; }
.sparkles i:nth-child(4) { left: 18%; top: 78%; animation-delay: 1.8s; width: 8px; height: 8px; }

.bubble { position: absolute; z-index: 4; left: 68%; top: 58px; transform: translateX(-50%) scale(.9); max-width: 86%; background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 16px; padding: 6px 12px; font-size: 14px; text-align: center; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 3px 0 var(--shadow); }
.bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }

.fx { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
.pop { position: absolute; font-family: var(--font-display); font-size: 22px; color: #fff; -webkit-text-stroke: 5px var(--brown); paint-order: stroke fill; transform: translate(-50%, -50%); animation: rise .9s ease-out forwards; white-space: nowrap; }
.pop.big { font-size: 28px; color: var(--banana); }
.gold { position: absolute; z-index: 6; width: 56px; height: 56px; padding: 0; border: 0; background: none; cursor: pointer; animation: drift var(--dur, 8s) linear forwards; filter: drop-shadow(0 0 10px rgba(255, 210, 63, .95)); }
.gold svg { width: 100%; height: 100%; animation: spin 1.6s ease-in-out infinite; }
.banner { position: absolute; z-index: 7; left: 50%; top: 44%; transform: translate(-50%, -50%) scale(.6); background: var(--banana); color: var(--brown); border: 3px solid var(--brown); border-radius: 18px; padding: 10px 18px; font-family: var(--font-display); font-size: 20px; text-align: center; opacity: 0; pointer-events: none; max-width: 90%; box-shadow: 0 5px 0 var(--brown); }
.banner.show { animation: banner 2.6s ease forwards; }
.combo { position: absolute; z-index: 3; right: 12px; bottom: 12px; background: var(--brown); color: #fff; border-radius: 999px; padding: 4px 12px; font-family: var(--font-display); font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.combo.show { opacity: 1; }

/* 업그레이드 */
.shop { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; overscroll-behavior: contain; }
.shop-head { font-family: var(--font-display); font-size: 17px; margin: 2px 2px 0; }
.item { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; cursor: pointer; transition: transform .08s, border-color .15s; }
.item:active { transform: scale(.985); }
.item .ico { width: 46px; height: 46px; border-radius: 13px; background: var(--panel-2); display: grid; place-items: center; }
.item .ico svg { width: 34px; height: 34px; }
.item .name { font-family: var(--font-display); font-size: 17px; line-height: 1.15; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item .lv { font-size: 12px; color: var(--muted); font-family: var(--font-body); }
.item > span:nth-child(2) { display: block; min-width: 0; }
.item .desc { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.buy { display: flex; align-items: center; gap: 5px; background: var(--banana); color: var(--brown); border-radius: 12px; border-bottom: 4px solid var(--banana-deep); padding: 6px 10px; font-family: var(--font-display); font-size: 16px; font-variant-numeric: tabular-nums; min-width: 84px; justify-content: center; }
.buy svg { width: 18px; height: 18px; flex: none; }
.item.cant { cursor: default; }
.item.cant .buy { background: var(--panel-2); color: var(--muted); border-bottom-color: var(--line); }
.item.ready { border-color: var(--banana-deep); }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 2px 2px 0; color: var(--muted); font-size: 12.5px; }
.reset { background: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--muted); cursor: pointer; font-size: 12.5px; }
.reset.arm { border-color: var(--bad); color: var(--bad); }

/* 복귀 보상 */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(10, 30, 22, .55); }
.modal .card { width: min(100%, 340px); background: var(--panel); border: 3px solid var(--line); border-radius: 24px; padding: 18px 18px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.modal img { width: 150px; max-width: 60%; }
.modal h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.modal p { margin: 0; color: var(--muted); }
.modal .gain { font-family: var(--font-display); font-size: 34px; color: var(--ink); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.modal .gain svg { width: 30px; height: 30px; }
.modal .ok { margin-top: 6px; background: var(--banana); color: var(--brown); border: 0; border-bottom: 5px solid var(--banana-deep); border-radius: 16px; padding: 10px 34px; font-family: var(--font-display); font-size: 20px; cursor: pointer; }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(25deg); } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
@keyframes drift { 0% { left: -70px; top: var(--y0, 30%); } 50% { top: var(--y1, 45%); } 100% { left: calc(100% + 10px); top: var(--y0, 30%); } }
@keyframes spin { 0%, 100% { transform: rotate(-12deg) scale(1); } 50% { transform: rotate(12deg) scale(1.12); } }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .char-bob, .sparkles i, .gold svg, .stage-6 .faces { animation: none; }
  .char-wrap { transition: none; }
}

/* 계정 버튼 · 상태 점 */
.top-right { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.acct { display: flex; align-items: center; gap: 6px; max-width: 150px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.acct span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--leaf); }
.dot.busy { background: var(--banana-deep); }
.dot.bad { background: var(--bad); }

/* 로그인 대화상자 */
.auth-card { align-items: stretch; text-align: left; max-height: calc(100% - 8px); overflow-y: auto; gap: 10px; }
.auth-card h2 { text-align: center; }
.auth-card .lead { color: var(--muted); text-align: center; font-size: 14px; }
.auth-card form { display: flex; flex-direction: column; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.fld input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%; }
.fld input:focus { outline: 3px solid var(--banana-deep); outline-offset: 1px; border-color: var(--banana-deep); }
.form-err { min-height: 1.2em; margin: 0; font-size: 13px; color: var(--bad); }
.auth-card .primary { background: var(--banana); color: var(--brown); border: 0; border-bottom: 5px solid var(--banana-deep); border-radius: 14px; padding: 10px 16px; font-family: var(--font-display); font-size: 18px; cursor: pointer; }
.auth-card .primary.alt { background: var(--panel-2); color: var(--ink); border-bottom-color: var(--line); }
.auth-card .primary:disabled { opacity: .6; cursor: default; }
.auth-card .ghost { background: none; border: 2px solid var(--line); color: var(--muted); border-radius: 14px; padding: 8px 14px; cursor: pointer; }
.auth-card .links { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.auth-card .link { background: none; border: 0; padding: 4px 2px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; }
.auth-card .note { font-size: 12.5px; text-align: center; }
.acct-mail { margin: 0; text-align: center; font-family: var(--font-display); font-size: 18px; overflow-wrap: anywhere; color: var(--ink); }
.sync-line { margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); }
.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; min-width: 0; }
.inst { border-top: 2px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
.inst p { margin: 0; }
.pick { display: flex; flex-direction: column; gap: 2px; background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.pick b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.pick i { font-style: normal; font-size: 12px; color: var(--brown); background: var(--banana); border-radius: 999px; padding: 1px 8px; align-self: flex-start; }
.pick .muted { color: var(--muted); font-size: 12.5px; }

.top-row { display: flex; align-items: center; gap: 6px; max-width: 100%; justify-content: flex-end; }
.snd { flex: none; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 50%; cursor: pointer; }
.snd svg { width: 18px; height: 18px; }
.snd .x { display: none; }
.snd.off { color: var(--muted); }
.snd.off .w { display: none; }
.snd.off .x { display: inline; }
.acct { max-width: 112px; }
/* 일일 보상 */
.modal .days { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0; }
.modal .day { background: var(--panel-2); border: 2px solid var(--line); border-radius: 12px; padding: 6px 2px; display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.modal .day b { font-family: var(--font-display); font-weight: 400; font-size: 14px; color: var(--ink); }
.modal .day.big { grid-column: span 2; }
.modal .day.today { background: var(--banana); border-color: var(--banana-deep); color: var(--brown); }
.modal .day.today b { color: var(--brown); }
.modal .day.done { opacity: .5; }
.modal .hint { font-size: 12.5px; }

/* 들판 몬스터 */
.wavelbl { position: absolute; z-index: 2; right: 12px; top: 52px; background: rgba(0,0,0,.35); color: #fff; border-radius: 999px; padding: 2px 10px; font-family: var(--font-display); font-size: 13px; pointer-events: none; }
.mons { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.mon { position: absolute; z-index: 3; left: 5%; bottom: 10px; width: min(32%, 140px); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: left .35s ease, width .35s ease, opacity .35s; }
.mons .mon.s0 { left: 22%; width: min(25%, 112px); z-index: 3; }
.mons .mon.s1 { left: 11%; width: min(20%, 90px); z-index: 2; opacity: .92; }
.mons .mon.s2 { left: 1.5%; width: min(16%, 72px); z-index: 1; opacity: .82; }
.mons .mon.s1 .mbody, .mons .mon.s2 .mbody { filter: brightness(.92); }
.stars, .stal { display: none; }
.reg-5 .stars, .reg-6 .stars { display: block; }
.reg-3 .stal { display: block; }
.reg-3 .cloud, .reg-4 .cloud, .reg-5 .cloud { display: none; }
.stage.reg-1 { --sky-a: #cfe9d0; --sky-b: #9fd4a6; --hill-a: #4f9d5a; --hill-b: #3b8049; --sun: #fff6c0; }
.stage.reg-2 { --sky-a: #ffeab4; --sky-b: #ffd27e; --hill-a: #e8c05a; --hill-b: #cfa43e; --sun: #fffbe6; }
.stage.reg-3 { --sky-a: #3b3050; --sky-b: #2a2238; --hill-a: #5b4a6a; --hill-b: #483a56; --sun: #b8e0ff; }
.stage.reg-4 { --sky-a: #5a2a24; --sky-b: #8a3a22; --hill-a: #3a2a28; --hill-b: #2a1d1c; --sun: #ffb347; }
.stage.reg-5 { --sky-a: #0b1030; --sky-b: #1a1a55; --hill-a: #3a3f7a; --hill-b: #2b2f66; --sun: #e8e8ff; }
.stage.reg-6 { --sky-a: #ffe6f6; --sky-b: #d9c3ff; --hill-a: #f3b6d8; --hill-b: #c9a0ec; --sun: #fff3a0; }
.reg-3 .evo-label, .reg-4 .evo-label, .reg-5 .evo-label { color: #fff; }
.reg-3 .evo-label span:last-child, .reg-4 .evo-label span:last-child, .reg-5 .evo-label span:last-child { color: rgba(255,255,255,.75); }
.mon[hidden] { display: none; }
.mon.boss { left: 3%; width: min(36%, 160px); }
.mon .mbar { width: 80%; height: 8px; border-radius: 999px; background: rgba(0,0,0,.3); border: 1.5px solid rgba(0,0,0,.45); overflow: hidden; }
.mon .mbar i { display: block; height: 100%; width: 100%; background: var(--bad); transition: width .12s linear; }
.mon .mbody { width: 100%; animation: monbob 1.3s ease-in-out infinite; transform-origin: 50% 100%; }
.mon .mbody svg { width: 100%; display: block; filter: drop-shadow(0 3px 0 rgba(0,0,0,.18)); }
.mon.in { animation: monin .25s ease-out; }
.mon.die { animation: mondie .3s ease-in forwards; }
.mon.hit .mbody { animation: monhit .14s linear, monbob 1.3s ease-in-out infinite; }
.lunger.atk { animation: lunge .26s ease-out; }
@keyframes monbob { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.04, .94); } }
@keyframes monin { from { transform: translateX(-40px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes mondie { to { transform: scale(.4) translateY(10px); opacity: 0; } }
@keyframes monhit { 0% { filter: brightness(2.2); transform: translateX(-6px); } 100% { filter: none; transform: none; } }
.shot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; animation: shot .3s ease-in forwards; filter: drop-shadow(0 0 6px rgba(255,210,63,.9)); }
.shot svg { width: 100%; height: 100%; animation: spin .3s linear infinite; }
@keyframes shot { to { transform: translate(var(--dx), var(--dy)); } }
@keyframes lunge { 0% { transform: translateX(0); } 35% { transform: translateX(-24%) rotate(-8deg); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .bigchest, .lunger.atk, .chestbox.shake, .rcard, .shot, .shot svg, .mon .mbody, .mon.in, .mon.hit .mbody, .faces.atk { animation: none; } .mon.die { animation: none; opacity: 0; } }

/* 보스전 */
.battle { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; }
.battle[hidden] { display: none; }
.battle .bico { flex: none; width: 40px; height: 40px; }
.battle .bico svg { width: 100%; height: 100%; }
.battle .bt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.battle .bt b { font-family: var(--font-display); font-weight: 400; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.battle .bt span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hpbar { height: 9px; border-radius: 999px; background: var(--panel-2); border: 1.5px solid var(--line); overflow: hidden; }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--bad); transition: width .15s linear; }
.battle .bb { flex: none; display: flex; flex-direction: column; gap: 4px; }
.battle .mini { padding: 3px 10px; font-size: 12.5px; }
.battle .mini.on { background: var(--leaf); color: #fff; border-color: transparent; }
.battle .mini.go { background: var(--banana); color: var(--brown); border-color: var(--banana-deep); }
.battle .mini:disabled { opacity: .55; cursor: default; }

/* 환생 */
.prest { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px 8px 12px; }
.prest[hidden] { display: none; }
.prest .pt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; color: var(--muted); }
.prest .pt b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--ink); overflow-wrap: anywhere; }
.prest button { flex: none; background: var(--leaf); color: #fff; border: 0; border-bottom: 4px solid rgba(0,0,0,.22); border-radius: 13px; padding: 8px 14px; font-family: var(--font-display); font-size: 15px; cursor: pointer; }
.prest button:disabled { background: var(--panel-2); color: var(--muted); border-bottom-color: var(--line); cursor: default; }
.modal .plist { margin: 0; padding: 0; list-style: none; text-align: left; font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; width: 100%; }
.modal .plist b { color: var(--ink); font-weight: 600; }
.modal .btns { display: flex; gap: 8px; width: 100%; margin-top: 6px; }
.modal .btns button { flex: 1; min-width: 0; border-radius: 14px; padding: 10px 8px; font-family: var(--font-display); font-size: 17px; cursor: pointer; background: var(--panel-2); color: var(--ink); border: 2px solid var(--line); }
.modal .btns .go { background: var(--leaf); color: #fff; border: 0; border-bottom: 5px solid rgba(0,0,0,.22); }
.item .ms { font-size: 11.5px; color: var(--brown); }

.shop-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.shop-bar .shop-head { flex: 1; margin: 2px; }
.mini { flex: none; background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.mini[hidden] { display: none; }
.modal .card.tall { max-height: calc(100% - 8px); overflow-y: auto; align-items: stretch; }
.modal .list { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.modal .lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; background: var(--panel-2); border: 2px solid var(--line); border-radius: 12px; padding: 7px 10px; }
.modal .lrow b { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.modal .lrow b i { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; }
.modal .lrow span { grid-column: 1; font-size: 12.5px; color: var(--muted); }
.modal .lrow button { grid-column: 2; grid-row: 1 / span 2; background: var(--leaf); color: #fff; border: 0; border-radius: 10px; padding: 7px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.modal .lrow button:disabled { background: var(--line); color: var(--muted); cursor: default; }
.modal .lrow.done { background: var(--banana); border-color: var(--banana-deep); }
.modal .lrow.done span, .modal .lrow.done b { color: var(--brown); }

.bigchest { position: absolute; z-index: 6; left: 8px; top: 50px; width: 108px; height: 96px; padding: 0; background: none; border: 0; cursor: pointer; animation: pulse 1.1s ease-in-out infinite; filter: drop-shadow(0 0 12px rgba(255, 210, 63, .95)); }
.bigchest[hidden] { display: none; }
.bigchest .cico { display: block; width: 100%; height: 100%; }
.bigchest .cico svg { width: 100%; height: 100%; display: block; }
.bigchest .cnt { position: absolute; z-index: 1; right: -4px; top: -6px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; border: 2px solid #fff; font-family: var(--font-display); font-size: 15px; line-height: 22px; text-align: center; }
/* 보물상자 · 장비 */
.mini.chest { background: var(--banana); color: var(--brown); border-color: var(--banana-deep); }
.mini.chest.has { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.chestbox { width: 150px; margin: 4px auto 0; }
.chestbox svg { width: 100%; display: block; filter: drop-shadow(0 4px 0 rgba(0,0,0,.15)); }
.chestbox.shake { animation: shake .5s linear; }
@keyframes shake { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-8deg) scale(1.05); } 35% { transform: rotate(8deg) scale(1.08); } 55% { transform: rotate(-6deg) scale(1.1); } 75% { transform: rotate(5deg) scale(1.1); } }
.rcard { display: flex; flex-direction: column; align-items: center; gap: 4px; animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.rcard .ibig { width: 120px; height: 100px; border-radius: 18px; background: var(--panel-2); border: 3px solid var(--rc, var(--line)); display: grid; place-items: center; box-shadow: 0 0 18px var(--rc, transparent); }
.rcard .ibig svg { width: 90%; height: 90%; }
.rcard b { font-family: var(--font-display); font-weight: 400; font-size: 19px; color: var(--rc, var(--ink)); }
.rcard span { font-size: 13px; color: var(--muted); }
.rtag { display: inline-block; font-size: 11.5px; color: #fff; background: var(--rc, #888); border-radius: 999px; padding: 1px 8px; }
.gslots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.gslot { background: var(--panel-2); border: 2px solid var(--rc, var(--line)); border-radius: 12px; padding: 4px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); min-width: 0; text-align: center; }
.gslot svg { width: 46px; height: 40px; }
.gslot .empty { width: 46px; height: 40px; display: grid; place-items: center; color: var(--line); font-size: 20px; }
.gslot b { font-weight: 600; font-size: 11.5px; color: var(--ink); overflow-wrap: anywhere; }
.irow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--panel-2); border: 2px solid var(--line); border-left: 6px solid var(--rc, var(--line)); border-radius: 12px; padding: 5px 8px 5px 6px; text-align: left; }
.irow svg { width: 46px; height: 40px; }
.irow .t { min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.irow .t b { font-size: 14px; font-weight: 600; color: var(--rc, var(--ink)); overflow-wrap: anywhere; }
.irow .bt { display: flex; flex-direction: column; gap: 4px; }
.irow button, .sellall { background: var(--leaf); color: #fff; border: 0; border-radius: 9px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.irow button.sell, .sellall { background: var(--panel); color: var(--ink); border: 2px solid var(--line); }
.irow.on { background: var(--banana); }
.modal .sub { font-size: 12.5px; }

/* 알림 */
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: min(92vw, 420px); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 9px 18px; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="wallet">
      <div class="count" aria-live="off"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-banana"/></svg><span id="count">0</span></div>
      <div class="rate">초당 <b id="rate">0</b>개 · 탭당 <b id="tapv">1</b>개</div>
    </div>
    <div class="top-right">
      <div class="top-row">
        <button class="snd" id="sndBtn" type="button" aria-pressed="true" aria-label="소리 끄기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M15 9l6 6M21 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="acct" id="acctBtn" type="button" aria-label="로그인 또는 회원가입"><span class="dot guest" id="acctDot"></span><span id="acctLabel">로그인</span></button>
      </div>
      <div class="stage-chip" id="chip">아기 바나나</div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="바나나 무대">
    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 400 380" preserveAspectRatio="xMidYMax slice">
        <circle cx="330" cy="70" r="30" fill="var(--sun)"/>
        <g class="cloud"><ellipse cx="90" cy="86" rx="46" ry="14" fill="#fff" opacity=".55"/><ellipse cx="116" cy="76" rx="30" ry="12" fill="#fff" opacity=".55"/></g>
        <ellipse class="cloud" cx="300" cy="150" rx="40" ry="11" fill="#fff" opacity=".4"/>
        <g class="stars" fill="#fff"><circle cx="40" cy="60" r="2"/><circle cx="110" cy="120" r="1.5"/><circle cx="170" cy="50" r="2.2"/><circle cx="240" cy="110" r="1.6"/><circle cx="290" cy="40" r="2"/><circle cx="370" cy="130" r="1.8"/><circle cx="60" cy="170" r="1.4"/><circle cx="210" cy="190" r="1.6"/></g>
        <g class="stal" fill="#1c1626"><path d="M0 0h60l-14 40-10-24-12 36-10-30-14 22z"/><path d="M150 0h70l-16 34-12-22-10 40-14-30-10 18z"/><path d="M300 0h100v26l-18 14-12-28-14 34-12-26-14 20z"/></g>
        <path d="M-10 330 Q90 262 200 300 T410 288 L410 400 L-10 400 Z" fill="var(--hill-a)"/>
        <path d="M-10 352 Q120 304 230 334 T410 322 L410 400 L-10 400 Z" fill="var(--hill-b)"/>
      </svg>
    </div>
    <div class="evo">
      <div class="evo-label"><span id="evoName">다음: 바나나</span><span id="evoPct">0%</span></div>
      <div class="bar"><i id="evoBar"></i></div>
    </div>
    <button type="button" class="bigchest" id="bigChest" hidden aria-label="보물상자 열기"><span class="cnt" id="bigCnt">1</span><span class="cico" id="bigIco"></span></button>
    <div class="wavelbl" id="waveLbl">스테이지 1-1</div>
    <div class="mons" id="mons"></div>
    <div class="mon boss" id="mon" hidden><div class="mbar"><i id="monBar"></i></div><div class="mbody" id="monBody"></div></div>
    <div class="bubble" id="bubble"></div>
    <button class="char-btn" id="charBtn" aria-label="바나나를 눌러 수확하기">
      <div class="char-wrap stage-0" id="charWrap">
        <div class="char-bob" id="charBob">
          <div class="char-squash" id="squash"><div class="lunger" id="lunger">
            <svg class="gearsvg under" id="gearUnder" viewBox="0 0 360 335" aria-hidden="true"></svg>
            <div class="faces" id="faces">
              <img data-f="normal" class="on" src="img/normal.png" alt="" draggable="false">
              <img data-f="happy" src="img/happy.png" alt="" draggable="false">
              <img data-f="sleep" src="img/sleep.png" alt="" draggable="false">
              <img data-f="angry" src="img/angry.png" alt="" draggable="false">
              <img data-f="cry" src="img/cry.png" alt="" draggable="false">
              <img data-f="surprise" src="img/surprise.png" alt="" draggable="false">
              <img data-f="dance" src="img/dance.png" alt="" draggable="false">
            </div>
            <svg class="gearsvg over" id="gearOver" viewBox="0 0 360 335" aria-hidden="true"></svg>
            <svg class="crown" viewBox="0 0 100 70" aria-hidden="true">
              <polygon points="8,62 14,18 36,40 50,6 64,40 86,18 92,62" fill="#ffcf2e" stroke="#6a3d1b" stroke-width="4" stroke-linejoin="round"/>
              <rect x="8" y="54" width="84" height="12" rx="3" fill="#f0a500" stroke="#6a3d1b" stroke-width="4"/>
              <circle cx="14" cy="16" r="5" fill="#e0502b" stroke="#6a3d1b" stroke-width="2.5"/>
              <circle cx="50" cy="6" r="5.5" fill="#3aa0e0" stroke="#6a3d1b" stroke-width="2.5"/>
              <circle cx="86" cy="16" r="5" fill="#3fae57" stroke="#6a3d1b" stroke-width="2.5"/>
            </svg>
            <div class="sparkles"><i></i><i></i><i></i><i></i></div>
          </div></div>
        </div>
      </div>
    </button>
    <div class="combo" id="combo">콤보 ×1.5</div>
    <div class="fx" id="fx"></div>
    <div class="banner" id="banner"></div>
  </section>

  <section class="battle" id="battle" hidden aria-label="보스전">
    <span class="bico" id="bossIco"></span>
    <div class="bt"><b id="bossName">보스</b><div class="hpbar"><i id="bossBar"></i></div><span id="bossMsg"></span></div>
    <div class="bb"><button type="button" class="mini" id="autoBtn" aria-pressed="true">자동 ON</button><button type="button" class="mini go" id="fightBtn">도전</button></div>
  </section>
  <section class="prest" id="prest" hidden>
    <div class="pt"><b id="prestTitle">바나나 씨앗 0개</b><span id="prestSub"></span></div>
    <button id="prestBtn" type="button">환생</button>
  </section>
  <div class="shop-bar"><div class="shop-head">업그레이드</div><button type="button" class="mini" id="perkBtn" hidden>씨앗 상점</button><button type="button" class="mini" id="achBtn">업적</button><button type="button" class="mini" id="gearBtn">장비</button><button type="button" class="mini chest" id="chestBtn">상자 0</button></div>
  <section class="shop" id="shop" aria-label="업그레이드 목록"></section>
  <footer class="foot">
    <span id="stats">자동으로 저장돼요</span>
    <button class="reset" id="reset" type="button">처음부터 다시</button>
  </footer>
</div>

<!-- 아이콘 모음 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-banana" viewBox="0 0 64 64">
      <path d="M14 14c2 0 4 1 5 3 2 16 12 26 30 28 3 1 5 3 4 6-4 7-14 10-24 8C14 55 6 40 8 22c0-4 3-8 6-8z" fill="#ffd23f" stroke="#6a3d1b" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M12 12l6-4 3 8-6 3z" fill="#6a3d1b"/>
      <path d="M52 52c2-1 4-2 5-4" stroke="#6a3d1b" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M17 24c2 12 9 21 21 25" stroke="#fff6b8" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/>
    </symbol>
  </defs>
</svg>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="game.js"></script>
<script src="auth.js"></script>
<script src="pwa.js"></script>
</body>
</html>
